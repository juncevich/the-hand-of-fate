name: E2E CI

# The whole stack on a throwaway minikube cluster, deployed exactly like locally
# (`K8S_OVERLAY=e2e ./k8s-start.sh`: images built from the Dockerfiles, Postgres, RustFS,
# Mailpit, gateway, monitoring), then infra/k8s/e2e.sh: gateway smoke test, every simulation
# scenario, mail delivery, metrics/logs in Mimir/Loki. The bot is not deployed (no token).
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - proto/**
      - simulation/**
      - api/openapi.yaml
      - infra/k8s/**
      - infra/nginx/**
      - infra/monitoring/**
      - k8s-start.sh
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - proto/**
      - simulation/**
      - api/openapi.yaml
      - infra/k8s/**
      - infra/nginx/**
      - infra/monitoring/**
      - k8s-start.sh
      - .github/workflows/e2e.yml
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MINIKUBE_VERSION: v1.39.0
  KUBECTL_VERSION: v1.37.0   # the Kubernetes version minikube v1.39.0 runs by default

jobs:

  e2e:
    name: E2E — Full stack on minikube
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: simulation/go.mod
          cache-dependency-path: simulation/go.sum

      - name: Install minikube and kubectl
        run: |
          curl -fsSLo "$RUNNER_TEMP/minikube" \
            "https://storage.googleapis.com/minikube/releases/$MINIKUBE_VERSION/minikube-linux-amd64"
          curl -fsSLo "$RUNNER_TEMP/kubectl" \
            "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          sudo install "$RUNNER_TEMP/minikube" "$RUNNER_TEMP/kubectl" /usr/local/bin/
          minikube version
          kubectl version --client

      - name: Deploy the stack
        env:
          K8S_OVERLAY: e2e
          MINIKUBE_CPUS: "4"
          MINIKUBE_MEMORY: 8g
        run: ./k8s-start.sh

      - name: End-to-end checks
        run: ./infra/k8s/e2e.sh

      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-diagnostics
          k="kubectl --context hand-of-fate -n hand-of-fate"
          $k get all,pvc,configmap -o wide > e2e-diagnostics/resources.txt 2>&1 || true
          $k get events --sort-by=.lastTimestamp > e2e-diagnostics/events.txt 2>&1 || true
          $k describe pods > e2e-diagnostics/pods-describe.txt 2>&1 || true
          for pod in $($k get pods -o name 2>/dev/null); do
            $k logs "$pod" --all-containers --prefix --tail=500 \
              > "e2e-diagnostics/$(basename "$pod").log" 2>&1 || true
          done
          minikube -p hand-of-fate logs --file=e2e-diagnostics/minikube.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diagnostics
          path: e2e-diagnostics/
          retention-days: 7
