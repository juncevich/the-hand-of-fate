name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - api/openapi.yaml
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - frontend/**
      - api/openapi.yaml
      - .github/workflows/frontend.yml

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:

  frontend-test:
    name: Frontend — Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - name: Check generated API types are up to date
        run: cd frontend && npm run check:api
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run test

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-24.04
    needs: frontend-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Keycloakify packs the login theme jar with Maven (preinstalled on the runner)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: cd frontend && npm ci
      # The SPA build plus Keycloak's login/email theme (dist_keycloak/fate-keycloak-theme.jar)
      - run: cd frontend && npm run build-keycloak-theme

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: keycloak-theme
          path: frontend/dist_keycloak/fate-keycloak-theme.jar
