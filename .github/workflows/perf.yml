name: Perf CI

# Compile + lint only — gatlingRun is a load test against a live backend and
# does not belong in a PR gate. Run it manually: see perf/README.md.
on:
  push:
    branches: [main]
    paths:
      - perf/**
      - .github/workflows/perf.yml
  pull_request:
    paths:
      - perf/**
      - .github/workflows/perf.yml

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:

  perf-check:
    name: Perf — Lint & Compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint (spotless)
        run: cd perf && ./gradlew spotlessCheck --no-daemon

      - name: Static analysis (detekt)
        run: cd perf && ./gradlew detekt --no-daemon

      - name: Compile simulations
        run: cd perf && ./gradlew compileGatlingKotlin --no-daemon
