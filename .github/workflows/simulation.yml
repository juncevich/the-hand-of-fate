name: Simulation CI

on:
  push:
    branches: [main]
    paths:
      - simulation/**
      - api/openapi.yaml
      - .github/workflows/simulation.yml
  pull_request:
    paths:
      - simulation/**
      - api/openapi.yaml
      - .github/workflows/simulation.yml

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  simulation-test:
    name: Simulation — Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: simulation/go.mod
          cache-dependency-path: simulation/go.mod

      - name: Download dependencies
        run: cd simulation && go mod download

      - name: Check generated API models are up to date
        run: cd simulation && go generate ./... && git diff --exit-code -- internal/client/models.gen.go

      - name: Check formatting
        run: test -z "$(gofmt -l simulation)"

      - run: cd simulation && go vet ./...
      - run: cd simulation && go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: cd simulation && go test ./...
      - run: cd simulation && go build -o /dev/null ./cmd/simulate
