openapi: 3.0.1
info:
  description: REST API of The Hand of Fate. Errors are returned as RFC 9457 problem
    details whose `title` is the message to show to the user.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: The Hand of Fate API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
tags:
- description: "Registration, login and refresh-token session"
  name: Auth
- description: User avatar images
  name: Avatars
- description: Linking the account to the Telegram bot
  name: Telegram
- description: "Votes, their participants/options and draws"
  name: Votes
paths:
  /api/v1/auth/change-password:
    post:
      description: Ends every other session; the caller gets a fresh one. 400 with
        code WRONG_PASSWORD on a wrong current password.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Changed; the new refresh token is set as a cookie
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Change the password
      tags:
      - Auth
  /api/v1/auth/forgot-password:
    post:
      description: "Sent only to a registered address, at most once a minute; the\
        \ link is valid for 30 minutes."
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Mail a password reset link
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: "Answers 429 after too many requests from this client or failed\
        \ attempts for this account, and 403 with code EMAIL_NOT_VERIFIED for a correct\
        \ password on an unconfirmed address."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Logged in; the refresh token is set as a cookie
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many attempts from this client
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Log in and start a session
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Logged out
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security:
      - refreshCookie: []
      summary: Revoke the current refresh token and clear the cookie
      tags:
      - Auth
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      responses:
        "204":
          description: Logged out everywhere
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Revoke every refresh token of the current user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: "The refresh token is read from the body if present, otherwise\
        \ from the cookie."
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Refreshed; the rotated refresh token is set as a cookie
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many attempts from this client
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security:
      - refreshCookie: []
      summary: Rotate the refresh token and issue a new access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      description: "No session is started: the account can sign in once the link from\
        \ the email is followed."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
          description: Registered; a verification link was mailed
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many attempts from this client
          headers:
            Retry-After:
              description: Seconds to wait
              schema:
                type: integer
              style: simple
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Create an account and mail a verification link
      tags:
      - Auth
  /api/v1/auth/resend-verification:
    post:
      description: "Sent only to a registered, unconfirmed address, at most once a\
        \ minute."
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
        required: true
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Mail a new verification link
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      description: Ends every session. 400 with code INVALID_TOKEN or TOKEN_EXPIRED
        for an unusable link.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Set a new password with the mailed token
      tags:
      - Auth
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Verified and signed in; the refresh token is set as a cookie
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Confirm the email address with the mailed token and sign in
      tags:
      - Auth
  /api/v1/telegram/link-token:
    get:
      operationId: getTelegramLinkToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTokenResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Issue a short-lived token for the bot's /link command
      tags:
      - Telegram
  /api/v1/telegram/unlink:
    delete:
      operationId: unlinkTelegram
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Unlink the Telegram account
      tags:
      - Telegram
  /api/v1/users/me/avatar:
    delete:
      operationId: deleteAvatar
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Delete the current user's avatar
      tags:
      - Avatars
    put:
      description: "PNG, JPEG or GIF up to 2 MB; stored center-cropped as a 256x256\
        \ PNG. 409 when object storage is disabled."
      operationId: uploadAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Upload or replace the current user's avatar
      tags:
      - Avatars
  /api/v1/users/{userId}/avatar:
    get:
      operationId: getAvatar
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - description: Avatar version from `avatarUrl`; a matching value makes the response
          immutable
        in: query
        name: v
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: The avatar image
          headers:
            Cache-Control:
              schema:
                type: string
              style: simple
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: Not modified since the ETag in If-None-Match
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The user has no avatar
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Avatar image of a user
      tags:
      - Avatars
  /api/v1/votes:
    get:
      operationId: listVotes
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseVoteSummaryDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: List votes the user created or participates in
      tags:
      - Votes
    post:
      description: "Without drawTarget the vote draws from options when any are given,\
        \ otherwise from participants. Options are rejected when drawTarget is PARTICIPANTS."
      operationId: createVote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoteWebRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetailDto"
          description: Created
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Create a vote
      tags:
      - Votes
  /api/v1/votes/{id}:
    delete:
      operationId: deleteVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Delete a vote (creator only)
      tags:
      - Votes
    get:
      operationId: getVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetailDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Get vote details
      tags:
      - Votes
  /api/v1/votes/{id}/close:
    post:
      operationId: closeVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Close a vote (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/draw:
    post:
      description: "Draws from the vote's drawTarget: its options, or its participants."
      operationId: drawVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawResultResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Draw a winner (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/history:
    get:
      deprecated: true
      description: Use `/history/page` instead.
      operationId: getHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrawHistoryDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Latest draw history (at most 100 entries)
      tags:
      - Votes
  /api/v1/votes/{id}/history/page:
    get:
      operationId: getHistoryPage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseDrawHistoryDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: "Paginated draw history, newest first"
      tags:
      - Votes
  /api/v1/votes/{id}/options:
    post:
      operationId: addOption
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOptionRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Add a named option (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/options/order:
    put:
      description: "optionIds must list every option of the vote exactly once, in\
        \ the new order."
      operationId: reorderOptions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderOptionsRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Reorder the options (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/options/{optionId}:
    delete:
      operationId: removeOption
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: optionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Remove an option (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/participants:
    post:
      operationId: addParticipant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Invite a participant by email (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/participants/{email}:
    delete:
      operationId: removeParticipant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: email
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Remove a participant (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/reopen:
    post:
      operationId: reopenVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Reopen a drawn or closed vote (creator only)
      tags:
      - Votes
components:
  schemas:
    AddOptionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - title
    AddParticipantRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        avatarUrl:
          type: string
          nullable: true
        displayName:
          type: string
        email:
          type: string
        userId:
          type: string
      required:
      - accessToken
      - avatarUrl
      - displayName
      - email
      - userId
    AvatarResponse:
      type: object
      properties:
        avatarUrl:
          type: string
      required:
      - avatarUrl
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 100
          minLength: 8
      required:
      - currentPassword
      - newPassword
    CreateVoteWebRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
          minLength: 0
          nullable: true
        drawTarget:
          type: object
          allOf:
          - $ref: "#/components/schemas/DrawTarget"
          nullable: true
        mode:
          $ref: "#/components/schemas/VoteMode"
        options:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
          nullable: true
        participantEmails:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
        title:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - title
    DrawHistoryDto:
      type: object
      properties:
        drawnAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        round:
          type: integer
          format: int32
        winnerDisplayName:
          type: string
          nullable: true
        winnerEmail:
          type: string
          nullable: true
        winnerOptionTitle:
          type: string
          nullable: true
      required:
      - drawnAt
      - id
      - round
      - winnerDisplayName
      - winnerEmail
      - winnerOptionTitle
    DrawResultResponse:
      type: object
      properties:
        newRoundStarted:
          type: boolean
        round:
          type: integer
          format: int32
        winnerDisplayName:
          type: string
          nullable: true
        winnerEmail:
          type: string
          nullable: true
        winnerOptionTitle:
          type: string
          nullable: true
      required:
      - newRoundStarted
      - round
      - winnerDisplayName
      - winnerEmail
      - winnerOptionTitle
    DrawTarget:
      type: string
      description: What a draw picks the winner from; fixed when the vote is created.
        With OPTIONS the participants are observers and are never drawn.
      enum:
      - PARTICIPANTS
      - OPTIONS
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    LinkTokenResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
      required:
