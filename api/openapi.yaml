openapi: 3.0.1
info:
  description: REST API of The Hand of Fate. Errors are returned as RFC 9457 problem
    details whose `title` is the message to show to the user.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: The Hand of Fate API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
- keycloak: []
tags:
- description: Sessions and deletion of the signed-in account
  name: Auth
- description: User avatar images
  name: Avatars
- description: Opting out of notification emails
  name: Notifications
- description: Linking the account to the Telegram bot
  name: Telegram
- description: "Votes, their participants/options and draws"
  name: Votes
paths:
  /api/v1/auth/delete-account:
    post:
      description: Needs a sign-in within the last minutes (403 with code REAUTHENTICATION_REQUIRED
        otherwise). Deletes the votes the user created; in other votes the user stops
        being a participant and past wins are anonymized. The Keycloak user is deleted
        too.
      operationId: deleteAccount
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Delete the account and everything it created
      tags:
      - Auth
  /api/v1/auth/logout-all:
    post:
      description: Keycloak issues no new tokens to them; access tokens already issued
        live until they expire.
      operationId: logoutAll
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: End every session of the current user
      tags:
      - Auth
  /api/v1/notifications/unsubscribe:
    post:
      description: 400 with code INVALID_TOKEN when the signature does not match the
        address.
      operationId: unsubscribe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeRequest"
        required: true
      responses:
        "204":
          description: Unsubscribed
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: "Stop notification emails to an address, from the link in such an email"
      tags:
      - Notifications
  /api/v1/notifications/unsubscribe/one-click:
    post:
      operationId: unsubscribeOneClick
      parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
      - in: query
        name: sig
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Unsubscribed
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: One-click unsubscribe (RFC 8058) used by mail clients via the List-Unsubscribe
        header
      tags:
      - Notifications
  /api/v1/telegram/link-token:
    get:
      operationId: getTelegramLinkToken
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTokenResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Issue a short-lived token for the bot's /link command
      tags:
      - Telegram
  /api/v1/telegram/unlink:
    delete:
      operationId: unlinkTelegram
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Unlink the Telegram account
      tags:
      - Telegram
  /api/v1/users/me:
    get:
      description: What the app shows of the account; read after signing in through
        Keycloak.
      operationId: getProfile
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: The signed-in account's profile
      tags:
      - Users
  /api/v1/users/me/avatar:
    delete:
      operationId: deleteAvatar
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Delete the current user's avatar
      tags:
      - Avatars
    put:
      description: "PNG, JPEG or GIF up to 2 MB; stored center-cropped as a 256x256\
        \ PNG. 409 when object storage is disabled."
      operationId: uploadAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Upload or replace the current user's avatar
      tags:
      - Avatars
  /api/v1/users/me/email-preferences:
    get:
      operationId: getEmailPreferences
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreferencesDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Whether notification emails reach the account's address
      tags:
      - Users
    put:
      description: Also undoes an unsubscribe done through the link in an email.
      operationId: updateEmailPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailPreferencesDto"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreferencesDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Turn notification emails on or off
      tags:
      - Users
  /api/v1/users/{userId}/avatar:
    get:
      operationId: getAvatar
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - description: Avatar version from `avatarUrl`; a matching value makes the response
          immutable
        in: query
        name: v
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            image/png:
              schema:
                type: string
                format: binary
          description: The avatar image
          headers:
            Cache-Control:
              schema:
                type: string
              style: simple
            ETag:
              schema:
                type: string
              style: simple
        "304":
          description: Not modified since the ETag in If-None-Match
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The user has no avatar
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      security: []
      summary: Avatar image of a user
      tags:
      - Avatars
  /api/v1/votes:
    get:
      operationId: listVotes
      parameters:
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseVoteSummaryDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: List votes the user created or participates in
      tags:
      - Votes
    post:
      description: "Without drawTarget the vote draws from options when any are given,\
        \ otherwise from participants. Options are rejected when drawTarget is PARTICIPANTS."
      operationId: createVote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoteWebRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetailDto"
          description: Created
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Create a vote
      tags:
      - Votes
  /api/v1/votes/stats:
    get:
      operationId: voteStats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteStatsDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Counts of the user's votes
      tags:
      - Votes
  /api/v1/votes/{id}:
    delete:
      operationId: deleteVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Delete a vote (creator only)
      tags:
      - Votes
    get:
      operationId: getVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteDetailDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Get vote details
      tags:
      - Votes
  /api/v1/votes/{id}/close:
    post:
      operationId: closeVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Close a vote (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/draw:
    post:
      description: "Draws from the vote's drawTarget: its options, or its participants."
      operationId: drawVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawResultResponse"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Draw a winner (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/history:
    get:
      deprecated: true
      description: Use `/history/page` instead.
      operationId: getHistory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrawHistoryDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Latest draw history (at most 100 entries)
      tags:
      - Votes
  /api/v1/votes/{id}/history/page:
    get:
      operationId: getHistoryPage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseDrawHistoryDto"
          description: OK
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: "Paginated draw history, newest first"
      tags:
      - Votes
  /api/v1/votes/{id}/options:
    post:
      operationId: addOption
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOptionRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Add a named option (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/options/order:
    put:
      description: "optionIds must list every option of the vote exactly once, in\
        \ the new order."
      operationId: reorderOptions
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderOptionsRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Reorder the options (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/options/{optionId}:
    delete:
      operationId: removeOption
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: optionId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Remove an option (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/participants:
    post:
      operationId: addParticipant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddParticipantRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Invite a participant by email (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/participants/{email}:
    delete:
      operationId: removeParticipant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: email
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Remove a participant (creator only)
      tags:
      - Votes
  /api/v1/votes/{id}/reopen:
    post:
      description: Only a DRAWN vote returns to PENDING; a CLOSED vote stays closed.
      operationId: reopenVote
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: Missing or invalid access token
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Error described by a problem detail
      summary: Reopen a drawn vote (creator only)
      tags:
      - Votes
components:
  schemas:
    AddOptionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - title
    AddParticipantRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    AvatarResponse:
      type: object
      properties:
        avatarUrl:
          type: string
      required:
      - avatarUrl
    CreateVoteWebRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
          minLength: 0
          nullable: true
        drawTarget:
          type: object
          allOf:
          - $ref: "#/components/schemas/DrawTarget"
          nullable: true
        mode:
          $ref: "#/components/schemas/VoteMode"
        options:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
          nullable: true
        participantEmails:
          type: array
          items:
            type: string
          maxItems: 100
          minItems: 0
        title:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - title
    DrawHistoryDto:
      type: object
      properties:
        drawnAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        round:
          type: integer
          format: int32
        winnerDisplayName:
          type: string
          nullable: true
        winnerEmail:
          type: string
          nullable: true
        winnerOptionTitle:
          type: string
          nullable: true
      required:
      - drawnAt
      - id
      - round
      - winnerDisplayName
      - winnerEmail
      - winnerOptionTitle
    DrawResultResponse:
      type: object
      properties:
        newRoundStarted:
          type: boolean
        round:
          type: integer
          format: int32
        winnerDisplayName:
          type: string
          nullable: true
        winnerEmail:
          type: string
          nullable: true
        winnerOptionTitle:
          type: string
          nullable: true
      required:
      - newRoundStarted
      - round
      - winnerDisplayName
      - winnerEmail
      - winnerOptionTitle
    DrawTarget:
      type: string
      description: What a draw picks the winner from; fixed when the vote is created.
        With OPTIONS the participants are observers and are never drawn.
      enum:
      - PARTICIPANTS
      - OPTIONS
    EmailPreferencesDto:
      type: object
      properties:
        notificationsEnabled:
          type: boolean
      required:
      - notificationsEnabled
    ErrorCode:
      type: string
      description: Machine-readable reason of the error. Clients show their own wording
        per value; `title` is an English fallback.
      enum:
      - VALIDATION_FAILED
      - REQUEST_INVALID
      - PAYLOAD_TOO_LARGE
      - UNAUTHORIZED
      - RATE_LIMITED
      - CONCURRENT_MODIFICATION
      - ALREADY_EXISTS
      - INTERNAL_ERROR
      - INVALID_EMAIL
      - INVALID_CREDENTIALS
      - EMAIL_ALREADY_REGISTERED
      - EMAIL_NOT_VERIFIED
      - WRONG_PASSWORD
      - LOGIN_THROTTLED
      - INVALID_TOKEN
      - TOKEN_EXPIRED
      - REFRESH_TOKEN_REQUIRED
      - USER_NOT_FOUND
      - EMAIL_LIMIT_REACHED
      - AVATAR_INVALID
      - AVATAR_NOT_FOUND
      - STORAGE_UNAVAILABLE
      - TELEGRAM_NOT_LINKED
      - TELEGRAM_ALREADY_LINKED
      - TELEGRAM_PRIVATE_CHAT_ONLY
      - TELEGRAM_LINK_TOKEN_INVALID
      - TELEGRAM_LINK_TOKEN_EXPIRED
      - VOTE_NOT_FOUND
      - VOTE_ACCESS_DENIED
      - NOT_VOTE_CREATOR
      - VOTE_NOT_PENDING
      - VOTE_NOT_DRAWN
      - VOTE_ALREADY_CLOSED
      - TITLE_INVALID
      - DESCRIPTION_TOO_LONG
      - TOO_MANY_PARTICIPANTS
      - TOO_MANY_OPTIONS
      - PARTICIPANT_EXISTS
      - OPTIONS_NOT_ALLOWED
      - OPTION_ORDER_INVALID
      - NO_OPTIONS
      - NO_PARTICIPANTS
      - PAGE_INVALID
      - VOTE_ID_INVALID
      - REAUTHENTICATION_REQUIRED
    LinkTokenResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
      required:
      - expiresAt
      - token
    PageResponseDrawHistoryDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/DrawHistoryDto"
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - content
      - number
      - size
      - totalElements
      - totalPages
    PageResponseVoteSummaryDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/VoteSummaryDto"
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - content
      - number
      - size
      - totalElements
      - totalPages
    ParticipantDto:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
        email:
          type: string
      required:
      - displayName
      - email
    ProblemDetail:
      type: object
      description: RFC 9457 problem detail
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
          description: "Field name to message, present on validation failures"
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: "Field name to the violated constraint (Email, NotBlank, Size,\
            \ ...), on validation failures"
        instance:
          type: string
          format: uri
        status:
          type: integer
          format: int32
        timestamp:
          type: string
          format: date-time
        title:
          type: string
          description: Human-readable message to show to the user
        type:
          type: string
          format: uri
      required:
