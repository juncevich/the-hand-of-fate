    keycloak:
      description: Sign in through Keycloak; Swagger UI uses the dev-only client `fate-swagger`
        with PKCE
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:3000/auth/realms/fate/protocol/openid-connect/auth
          scopes:
            openid: Sign in
          tokenUrl: http://localhost:3000/auth/realms/fate/protocol/openid-connect/token
      type: oauth2
