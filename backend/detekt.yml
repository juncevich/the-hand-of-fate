config:
  validation: true
  warningsAsErrors: false

# detekt 2.x "allowed*" values are the maximum permitted (1.x "threshold" was the first
# reported value where the defaults differ by one); limits are unchanged from the 1.x config.
complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 14
  CognitiveComplexMethod:
    allowedComplexity: 20
  LongMethod:
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 9  # JPA entities and Spring service constructors can be wide
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 20

naming:
  FunctionNaming:
    # Allow backtick-quoted test names alongside regular camelCase
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*|`[^`]+`'

style:
  MagicNumber:
    active: false             # Magic numbers are common in tests and proto field numbers
  MaxLineLength:
    active: false             # Handled by ktlint via spotless
  WildcardImport:
    active: false             # Allowed intentionally (FateProto.*, mockk.*, etc.)
  ReturnCount:
    max: 4
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  ForbiddenComment:
    active: false             # TODO/FIXME comments are acceptable during development
  UseDataClass:
    active: false             # JPA entities cannot be data classes

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

performance:
  SpreadOperator:
    active: false  # idiomatic in Spring Boot main() and MockK *anyVararg() stubs

potential-bugs:
  DontDowncastCollectionTypes:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnreachableCatchBlock:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
