config:
  validation: true
  warningsAsErrors: false
  # The 1.x threshold keys below are for the IntelliJ detekt plugin, which still runs detekt 1.23;
  # detekt 2.x (Gradle) doesn't know them, so its config validation skips them.
  excludes:
    - 'complexity>.*>threshold'
    - 'complexity>LongParameterList>functionThreshold'
    - 'complexity>LongParameterList>constructorThreshold'
    - 'complexity>TooManyFunctions>thresholdIn.*'

# detekt 2.x "allowed*" values are the maximum permitted; the 1.x "threshold" next to each is the
# first reported value, one more — keep both in step.
complexity:
  CyclomaticComplexMethod:
    allowedComplexity: 14
    threshold: 15
  CognitiveComplexMethod:
    allowedComplexity: 20
    threshold: 21
  LongMethod:
    allowedLines: 80
    threshold: 81
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 9  # JPA entities and Spring service constructors can be wide
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 20
    thresholdInFiles: 31
    thresholdInClasses: 21
    thresholdInInterfaces: 21
    thresholdInObjects: 21
    thresholdInEnums: 21

naming:
  FunctionNaming:
    # Allow backtick-quoted test names alongside regular camelCase
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*|`[^`]+`'

style:
  MagicNumber:
    active: false             # Magic numbers are common in tests and proto field numbers
  MaxLineLength:
    active: false             # Handled by ktlint via spotless
  WildcardImport:
    active: false             # Allowed intentionally (FateProto.*, mockk.*, etc.)
  ReturnCount:
    max: 4
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  ForbiddenComment:
    active: false             # TODO/FIXME comments are acceptable during development
  UseDataClass:
    active: false             # JPA entities cannot be data classes

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

performance:
  SpreadOperator:
    active: false  # idiomatic in Spring Boot main() and MockK *anyVararg() stubs

potential-bugs:
  DontDowncastCollectionTypes:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnreachableCatchBlock:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
