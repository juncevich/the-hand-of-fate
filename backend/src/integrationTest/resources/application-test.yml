# Integration-test profile (Testcontainers). Disables the production secret guard
# (SecretsValidator is @Profile("!dev & !test")).
management:
  # No OTel collector runs next to the tests; don't try to push metrics/traces.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false

# OpenApiSpecIntegrationTest diffs /v3/api-docs.yaml against the committed api/openapi.yaml.
springdoc:
  api-docs:
    enabled: true

app:
  keycloak:
    # Tests run IdentityDeletionWorker themselves.
    deletion-delay-ms: 3600000
  notifications:
    delivery-enabled: false
