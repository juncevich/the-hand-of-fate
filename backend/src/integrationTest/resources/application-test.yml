# Integration-test profile (Testcontainers). Keeps the demo-user seed so tests
# that reference admin@admin.com as a FK target keep working, and disables the
# production secret guard (SecretsValidator is @Profile("!dev & !test")).
spring:
  flyway:
    placeholders:
      seedDemoUser: "true"

management:
  # No OTel collector runs next to the tests; don't try to push metrics/traces.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false

app:
  notifications:
    delivery-enabled: false
  # Tests fire many auth requests from a single (loopback) client; the limiter
  # would otherwise trip and turn expected 200s into 429s.
  rate-limit:
    enabled: false
