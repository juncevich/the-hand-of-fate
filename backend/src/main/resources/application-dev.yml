# Local development profile.
# Activated by `./gradlew bootRun` (see build.gradle.kts), dev-start.sh and
# docker-compose. Relaxes production-only guards for a smooth local workflow.
app:
  # Local RustFS from docker-compose(.infra).yml; the bucket is created on first start.
  storage:
    enabled: ${S3_ENABLED:true}
    access-key: ${S3_ACCESS_KEY:rustfsadmin}
    secret-key: ${S3_SECRET_KEY:rustfsadmin}
    create-bucket: true

management:
  tracing:
    sampling:
      # Trace every request locally, so Tempo always has the trace behind a log line.
      probability: 1.0

springdoc:
  # Swagger UI / OpenAPI docs are a local-dev convenience only.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # "Authorize" signs in through Keycloak's dev-only client (infra/keycloak/realm/fate.yaml).
    oauth:
      client-id: fate-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
