spring:
  application:
    name: hand-of-fate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fate}
    username: ${DB_USERNAME:fate}
    password: ${DB_PASSWORD:fate}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    open-in-view: false

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      # Avatars are the only uploads; the image is re-encoded to a small PNG server-side.
      max-file-size: 2MB
      max-request-size: 3MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      # Prod-safe default: the demo user (admin@admin.com) is NOT seeded.
      # Enabled only under the dev/test profiles.
      seedDemoUser: "false"

  grpc:
    server:
      port: 9090
      # Bind to loopback by default so the shared-secret-only (plaintext) gRPC
      # channel is not exposed off-host. Override to 0.0.0.0 only on a trusted
      # internal network (e.g. the Docker bridge).
      address: ${GRPC_BIND_ADDRESS:127.0.0.1}
      # Not exposed before the move to Spring Boot's gRPC starter; keep the
      # public surface to FateService only.
      reflection:
        enabled: false
      health:
        enabled: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  shutdown: graceful
  # Tomcat's RemoteIpValve: request.remoteAddr (used by RateLimitFilter) and the scheme come from
  # X-Forwarded-For/-Proto only when the direct peer is a trusted proxy. Trusted by default are
  # loopback and private ranges (nginx on the same host, docker/k8s networks); a client hitting
  # the backend directly cannot spoof its address. Override with
  # server.tomcat.remoteip.internal-proxies (a regex) if the proxy sits on a public address.
  forward-headers-strategy: native

grpc:
  shared-secret: ${GRPC_SHARED_SECRET:changeme-dev-grpc-shared-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

springdoc:
  # Disabled by default so the API surface/schemas are not exposed in production;
  # the dev profile re-enables it (see application-dev.yml).
  # The generated spec is committed as api/openapi.yaml, so keep its output stable.
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
    # 3.0 rather than 3.1: oapi-codegen (simulation) and oasdiff fully support only 3.0.
    version: openapi_3_0
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

jwt:
  access-secret: ${JWT_ACCESS_SECRET:changeme-dev-secret-key-256-bits-long-xxxxxxxxxxxx}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    # Sender address; when blank, falls back to MAIL_USERNAME, then noreply@handoffate.app
    from: ${MAIL_FROM:}
    # Cap on simultaneous SMTP sends; outbox batches are dispatched on virtual threads
    max-concurrent-sends: ${MAIL_MAX_CONCURRENT_SENDS:4}
  # Notification outbox delivery (see NotificationProperties). Failed jobs back off exponentially
  # from retry-base-delay up to retry-max-delay; after max-attempts they are marked failed
  # (metric notification.dead) and purged after failed-retention.
  notifications:
    batch-size: 20
    max-attempts: 10
    lease: 2m
    retry-base-delay: 1m
    retry-max-delay: 6h
    failed-retention: 14d
    # Emails one user's actions (invitations, draw results) may trigger per rolling window
    # (see EmailBudget): inviting beyond it is rejected with 429, draws still run but their
    # result emails are dropped (metric notification.suppressed).
    email-budget-per-user: ${EMAIL_BUDGET_PER_USER:200}
    email-budget-window: 24h
  refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  # S3-compatible object storage for avatars (see StorageProperties). Disabled unless
  # configured: avatar endpoints then answer 409 and users simply have no avatar.
  storage:
    enabled: ${S3_ENABLED:false}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:fate}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style: ${S3_PATH_STYLE:true}
