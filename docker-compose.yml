name: hand-of-fate

services:

  # ── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fate
      POSTGRES_USER: fate
      POSTGRES_PASSWORD: fate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fate -d fate"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/juncevich/fate-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP REST
    expose:
      - "9090"        # gRPC is internal-only for the Telegram bot
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/fate
      DB_USERNAME: fate
      DB_PASSWORD: fate
      JWT_ACCESS_SECRET: dev-secret-key-at-least-256-bits-long-for-testing-purposes-only
      JWT_ACCESS_TTL_MINUTES: 15
      JWT_REFRESH_TTL_DAYS: 30
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:3000
      REFRESH_COOKIE_SECURE: "false"
      # gRPC is reached by the bot across the Docker bridge network, so bind to
      # all interfaces here (the shared secret still authenticates callers).
      GRPC_BIND_ADDRESS: 0.0.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:-dev-grpc-shared-secret-for-testing-only}
      S3_ENDPOINT: http://rustfs:9000
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: http://localhost/auth
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/juncevich/fate-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Telegram Bot ───────────────────────────────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: ghcr.io/juncevich/fate-bot:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      GRPC_SERVER_ADDR: backend:9090
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:-dev-grpc-shared-secret-for-testing-only}
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - keycloak

  # ── Keycloak (authorization server, docs/adr/0001) ─────────────────────────
  # Behind the gateway on /auth: issuer http://localhost/auth/realms/fate, admin console
  # http://localhost/auth/admin (admin / admin). The realm is (re)applied by `keycloak-config`.
  keycloak-db-init:
    image: postgres:17.4-alpine
    entrypoint: ["/bin/sh", "/scripts/create-database.sh"]
    environment:
      PGHOST: postgres
      PGUSER: fate
      PGPASSWORD: fate
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./infra/keycloak/create-database.sh:/scripts/create-database.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_FEATURES: user-event-metrics
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    expose:
      - "8080"        # reached through the gateway (/auth/) and by the backend
    healthcheck:
      # No curl in the image; ask the management port (9000) over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  keycloak-config:
    image: adorsys/keycloak-config-cli:6.5.1-26
    entrypoint: ["/bin/sh", "/scripts/apply-config.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: admin
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 180s
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_FILES_LOCATIONS: file:/config/realm/*,file:/config/realm-dev/*
      KC_APP_URL: http://localhost
      KC_BACKEND_CLIENT_SECRET: dev-keycloak-backend-secret
      KC_DEV_CLIENTS_ENABLED: "true"
      KC_SMTP_HOST: mailpit
      KC_SMTP_PORT: "1025"
      # Social login (optional, from .env): a provider is enabled when its client id is set.
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
    volumes:
      - ./infra/keycloak/apply-config.sh:/scripts/apply-config.sh:ro
      - ./infra/keycloak/realm:/config/realm:ro
      - ./infra/keycloak/realm-dev:/config/realm-dev:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # ── Mail (local dev only) ──────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # S3-compatible object storage (avatars). Dev-only credentials; console on :9001.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - rustfs_data:/data

  # ── Observability ─────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/monitoring/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - loki
      - mimir
      - tempo

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  mimir:
    image: grafana/mimir:2.15.0
    restart: unless-stopped
    command: ["--config.file=/etc/mimir/config.yaml"]
    volumes:
      - ./infra/monitoring/mimir.yaml:/etc/mimir/config.yaml:ro
      - mimir_data:/data/mimir
    ports:
      - "9009:9009"

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/monitoring/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # HTTP API (Grafana datasource)

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
      - mimir
      - tempo

volumes:
  postgres_data:
  rustfs_data:
  loki_data:
  mimir_data:
  tempo_data:
  grafana_data:
