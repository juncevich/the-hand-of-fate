apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  labels:
    app.kubernetes.io/name: bot
spec:
  # Always at most 1 replica: two pollers on one token make Telegram answer 409 Conflict.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot
    spec:
      containers:
        - name: bot
          image: fate-bot
          env:
            - name: GRPC_SERVER_ADDR
              value: backend:9090
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: BOT_TOKEN
            - name: GRPC_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: shared-secrets
                  key: GRPC_SHARED_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
