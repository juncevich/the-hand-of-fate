# Single entry point, same as the `nginx` service in docker-compose: SPA on `/`, REST on
# `/api/`, Keycloak on `/auth/`, security headers and the auth rate limit. Actuator is not proxied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      # nginx resolves its upstreams once at startup and exits if they are unknown — which
      # happens while CoreDNS is still coming up (e.g. after `minikube start` resumes a node).
      initContainers:
        - name: wait-for-dns
          image: nginx:1.27.4-alpine
          command: ["sh", "-c", "until getent hosts backend && getent hosts frontend && getent hosts keycloak; do sleep 1; done"]
      containers:
        - name: nginx
          image: nginx:1.27.4-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-nginx
