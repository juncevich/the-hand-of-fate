# Application workloads, environment-agnostic. Configuration (backend-config,
# backend-secrets, shared-secrets, keycloak-*) and images come from an overlay — see overlays/local.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hand-of-fate

labels:
  - pairs:
      app.kubernetes.io/part-of: hand-of-fate

resources:
  - namespace.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - bot/deployment.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - keycloak/deployment.yaml
  - keycloak/service.yaml
  - keycloak/config-job.yaml

# The gateway reuses the docker-compose nginx config verbatim (upstreams `backend:8080` and
# `frontend:80` match the Service names), so the file lives outside this directory and the
# build needs `--load-restrictor LoadRestrictionsNone` (k8s-start.sh passes it).
configMapGenerator:
  - name: gateway-nginx
    files:
      - nginx.conf=../../nginx/nginx.conf
  # Realm `fate` and the config-cli entrypoint (infra/keycloak/), applied by the keycloak-config Job.
  - name: keycloak-realm
    files:
      - fate.yaml=../../keycloak/realm/fate.yaml
  - name: keycloak-scripts
    files:
      - apply-config.sh=../../keycloak/apply-config.sh
