# A DaemonSet so the filelog receiver sees the node's pod logs (one node locally).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          args:
            - --config=/etc/otel/config.yaml
            - --config=/etc/otel/k8s.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi   # memory_limiter in the config caps the pipeline at 256 MiB
          securityContext:
            runAsUser: 0      # pod log files on the node are root-owned
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: filelog-offsets
              mountPath: /var/lib/otelcol/filelog
      volumes:
        - name: filelog-offsets
          hostPath:
            path: /var/lib/otelcol/filelog
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: otel-collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
