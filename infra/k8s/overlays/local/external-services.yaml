# Host access. k8s-start.sh creates the minikube node with `--ports 127.0.0.1:<p>:<p>` for
# each nodePort below, so they answer on localhost without `minikube tunnel` or port-forward.
# The 30xxx range keeps them clear of the docker-compose ports (3000, 8080, 5432, 8025, …),
# so both environments can run side by side.
apiVersion: v1
kind: Service
metadata:
  name: gateway-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: ui
      port: 8025
      targetPort: ui
      nodePort: 30025
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-external
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
