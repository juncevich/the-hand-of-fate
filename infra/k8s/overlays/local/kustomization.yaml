# Local minikube environment (profile `hand-of-fate`), driven by ../../../../k8s-start.sh.
# Build with `--load-restrictor LoadRestrictionsNone` (the base reads infra/nginx/nginx.conf).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hand-of-fate

resources:
  - ../../base
  - postgres.yaml
  - rustfs.yaml
  - mailpit.yaml
  - external-services.yaml

# OTel Collector + Loki + Mimir + Grafana; remove this line to run without monitoring
# (and its NodePort in external-services.yaml).
components:
  - ../../components/observability

patches:
  - path: backend-wait-for-postgres.yaml
  - path: keycloak-create-database.yaml
  - path: keycloak-config-dev-realm.yaml

# Built on the host and `minikube image load`-ed by k8s-start.sh, never pulled.
images:
  - name: fate-backend
    newTag: dev
  - name: fate-frontend
    newTag: dev
  - name: fate-bot
    newTag: dev

configMapGenerator:
  - name: backend-config
    literals:
      # Dev profile: seeds admin@admin.com / admin, non-Secure refresh cookie, Swagger on,
      # RustFS credentials and bucket auto-creation (application-dev.yml).
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/fate
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - FRONTEND_URL=http://localhost:30080
      - S3_ENDPOINT=http://rustfs:9000
  # Keycloak server: issuer http://localhost:30080/auth/realms/fate (through the gateway).
  - name: keycloak-server-config
    literals:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_HOSTNAME=http://localhost:30080/auth
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
  # keycloak-config-cli: this environment's realm settings, plus the dev realm file.
  - name: keycloak-config
    literals:
      - KEYCLOAK_USER=admin
      - IMPORT_FILES_LOCATIONS=file:/config/realm/*,file:/config/realm-dev/*
      - KC_APP_URL=http://localhost:30080
      - KC_DEV_CLIENTS_ENABLED=true
      - KC_SMTP_HOST=mailpit
      - KC_SMTP_PORT=1025
  - name: keycloak-realm-dev
    files:
      - fate-dev.yaml=../../../keycloak/realm-dev/fate-dev.yaml
  - name: keycloak-db-scripts
    files:
      - create-database.sh=../../../keycloak/create-database.sh

# Dev-only credentials, the same values docker-compose.yml uses.
secretGenerator:
  - name: backend-secrets
    literals:
      - DB_USERNAME=fate
      - DB_PASSWORD=fate
      - JWT_ACCESS_SECRET=dev-secret-key-at-least-256-bits-long-for-testing-purposes-only
  - name: postgres-secrets
    literals:
      - POSTGRES_USER=fate
      - POSTGRES_PASSWORD=fate
  - name: rustfs-secrets
    literals:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
  - name: keycloak-server-secrets
    literals:
      - KC_DB_PASSWORD=keycloak
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
  - name: keycloak-config-secrets
    literals:
      - KEYCLOAK_PASSWORD=admin
      - KC_BACKEND_CLIENT_SECRET=dev-keycloak-backend-secret
  # GRPC_SHARED_SECRET + BOT_TOKEN, written from the root .env by k8s-start.sh (gitignored).
  - name: shared-secrets
    envs:
      - .secrets.env
  # OAUTH_<P>_CLIENT_ID/SECRET for social login, likewise from .env (empty → provider off).
  - name: oauth-secrets
    envs:
      - .oauth.env
