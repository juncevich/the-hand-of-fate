apiVersion: 1

# Fixed uids: the provisioned dashboards and the Loki → Tempo / Tempo → Loki links refer to them.
datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: hand-of-fate

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Spring Boot writes `[<traceId>-<spanId>]` into every log line handled within a trace.
      derivedFields:
        - name: TraceID
          matcherRegex: '\[([0-9a-f]{32})-[0-9a-f]{16}\]'
          datasourceUid: tempo
          url: '$${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} |= "$${__trace.traceId}"'
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
