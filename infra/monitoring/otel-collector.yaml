receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Keycloak's Prometheus endpoint on its management port (docker-compose.yml and k8s both
  # name the service `keycloak`): HTTP, JVM and keycloak_user_events_total{event,error,realm}.
  prometheus/keycloak:
    config:
      scrape_configs:
        - job_name: keycloak
          scrape_interval: 30s
          metrics_path: /auth/metrics
          static_configs:
            - targets: ["keycloak:9000"]

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: local

exporters:
  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: hand-of-fate

  # Loki 3 ingests OTLP natively (the contrib `loki` exporter is deprecated); resource
  # attributes such as service.name and k8s.* become index labels.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlp/tempo]

    metrics:
      receivers:  [otlp, prometheus/keycloak]
      processors: [memory_limiter, resource, batch]
      exporters:  [prometheusremotewrite]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, resource, batch]
      exporters:  [otlphttp/loki]
