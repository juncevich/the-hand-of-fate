# Tempo single-binary mode (local / small deployments): traces from the OTel Collector over
# OTLP, blocks on the local filesystem. Shared by docker-compose and the minikube
# observability component.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        # Tempo binds receivers to localhost unless told otherwise.
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Tempo 3 has no compactor: compaction and retention run in the backend scheduler and worker,
# both part of the single binary (no Kafka needed in this mode).
backend_worker:
  compaction:
    block_retention: 72h
