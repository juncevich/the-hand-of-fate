user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Rate limiting for auth endpoints
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Keycloak: only form posts and token requests count (login, registration, reset, code
    # exchange); its pages, scripts and styles are not limited. An empty key is not limited.
    map $request_method $keycloak_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $keycloak_limit_key zone=keycloak:10m rate=30r/m;

    upstream backend  { server backend:8080; }
    upstream frontend { server frontend:80; }
    upstream keycloak { server keycloak:8080; }

    # WebSocket upgrade on `/` — Vite's HMR socket when the frontend is the dev server (Tilt)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ────────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Frontend SPA
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host       $host;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }

        # The SPA's silent token renewal runs this page in a hidden iframe of the app itself, so it
        # may be framed by this origin; everything else stays unframeable. add_header here replaces
        # the server-level headers, hence the full set.
        location = /oidc/silent.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # Backend REST API
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            # Avatar uploads (backend caps a file at 2MB, a request at 3MB)
            client_max_body_size 3m;
        }

        # Auth rate limiting
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak (docs/adr/0001) on the app's origin, so its SSO cookie is first-party. It sends
        # its own CSP and X-Frame-Options (SAMEORIGIN — the SPA renews tokens in an iframe), so
        # this location sets only the headers Keycloak doesn't; add_header here replaces the
        # server-level ones.
        location /auth/ {
            limit_req zone=keycloak burst=30 nodelay;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            proxy_pass         http://keycloak;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;
            # Keycloak's redirects carry large Set-Cookie headers
            proxy_buffer_size       128k;
            proxy_buffers           4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Actuator is intentionally NOT proxied — health/metrics must not be
        # reachable through the public gateway. Reach it directly on backend:8080
        # inside the compose network if needed.
    }
}
