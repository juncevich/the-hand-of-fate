build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

naming:
  FunctionNaming:
    # Allow PascalCase factory functions (e.g. `LongFeeder(...)`), a common Kotlin idiom
    # for functions that construct/return a type-like value.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'

style:
  MagicNumber:
    active: false             # Load parameters (user counts, durations, thresholds) are inherently numeric literals
  MaxLineLength:
    active: false             # Handled by ktlint via spotless
  WildcardImport:
    active: false             # Gatling's Java DSL is conventionally imported via CoreDsl.* / HttpDsl.*
  ForbiddenComment:
    active: false             # TODO/FIXME comments are acceptable during development

comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
