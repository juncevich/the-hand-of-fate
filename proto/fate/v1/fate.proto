syntax = "proto3";

package fate.v1;

option go_package = "github.com/juncevich/the-hand-of-fate/bot/gen/fate/v1;fatev1";
option java_package = "com.juncevich.fate.grpc";
option java_multiple_files = true;
option java_outer_classname = "FateProto";

// Identity: every telegram_id is the Telegram *user* id of the sender (always positive), never a
// chat id — group chat ids are shared by all members and are rejected when linking.
//
// Error contract. Mutating RPCs report expected failures in `success` / `message` / `error_code`;
// every other failure is a gRPC status whose expected (non-INTERNAL) cases carry
// google.rpc.ErrorInfo{domain: "fate.v1", reason: <ErrorCode name without the ERROR_CODE_ prefix>},
// e.g. reason "TELEGRAM_NOT_LINKED" when the caller's Telegram account is not linked. `message` is
// an English fallback: clients show their own wording per ErrorCode.
//   INVALID_ARGUMENT     malformed request (bad vote id, pagination, input validation)
//   NOT_FOUND            the vote does not exist, or the Telegram account is not linked
//   PERMISSION_DENIED    the caller may not access the vote
//   FAILED_PRECONDITION  the vote's state does not allow the action
//   RESOURCE_EXHAUSTED   the user used up a quota (e.g. the notification email budget)
//   UNAUTHENTICATED      missing or invalid x-grpc-shared-secret
//   INTERNAL             unexpected server error; the description is generic
service FateService {
  // Link a Telegram account using a short-lived token generated by the web app
  rpc LinkTelegramAccount(LinkTelegramAccountRequest) returns (LinkTelegramAccountResponse);

  // Unlink Telegram account
  rpc UnlinkTelegramAccount(UnlinkTelegramAccountRequest) returns (UnlinkTelegramAccountResponse);

  // List votes the telegram user participates in or created
  rpc GetMyVotes(GetMyVotesRequest) returns (GetMyVotesResponse);

  // Create a vote for the linked telegram user
  rpc CreateVote(CreateVoteRequest) returns (CreateVoteResponse);

  // Get detailed info about a vote
  rpc GetVoteDetails(GetVoteDetailsRequest) returns (GetVoteDetailsResponse);

  // Perform a draw (only vote creator can do this)
  rpc DrawVote(DrawVoteRequest) returns (DrawVoteResponse);

  // Get the last draw result for a vote
  rpc GetLastDrawResult(GetLastDrawResultRequest) returns (GetLastDrawResultResponse);

  // Get draw history for a vote
  rpc GetVoteHistory(GetVoteHistoryRequest) returns (GetVoteHistoryResponse);
}

// ── Link / Unlink ─────────────────────────────────────────────────────────────

message LinkTelegramAccountRequest {
  string link_token    = 1;
  int64  telegram_id   = 2;
  string telegram_name = 3;
}

message LinkTelegramAccountResponse {
  bool   success      = 1;
  string display_name = 2;
  string message      = 3;
  // Set when success is false.
  ErrorCode error_code = 4;
}

message UnlinkTelegramAccountRequest {
  int64 telegram_id = 1;
}

message UnlinkTelegramAccountResponse {
  bool   success = 1;
  string message = 2;
  // Set when success is false.
  ErrorCode error_code = 3;
}

// ── Vote queries ──────────────────────────────────────────────────────────────

message GetMyVotesRequest {
  int64 telegram_id = 1;
}

message GetMyVotesResponse {
  repeated VoteSummary votes = 1;
}

message CreateVoteRequest {
  int64  telegram_id         = 1;
  string title               = 2;
  string description         = 3;
  VoteMode mode              = 4;
  repeated string participant_emails = 5;
  repeated string options    = 6;
  // Fixed once the vote exists. UNSPECIFIED: OPTIONS when options are given, else PARTICIPANTS.
  DrawTarget draw_target     = 7;
}

message CreateVoteResponse {
  bool success = 1;
  string message = 2;
  GetVoteDetailsResponse vote = 3;
  // Set when success is false.
  ErrorCode error_code = 4;
}

message VoteSummary {
  string vote_id           = 1;
  string title             = 2;
  VoteStatus status        = 3;
  VoteMode   mode          = 4;
  int32  participant_count = 5;
  bool   is_creator        = 6;
  int32  current_round     = 7;
}

message GetVoteDetailsRequest {
  string vote_id    = 1;
  int64  telegram_id = 2;
}

message VoteOptionInfo {
  string option_id = 1;
  string title     = 2;
}

message GetVoteDetailsResponse {
  string vote_id             = 1;
  string title               = 2;
  string description         = 3;
  VoteMode   mode            = 4;
  VoteStatus status          = 5;
  int32  current_round       = 6;
  repeated ParticipantInfo participants = 7;
  DrawResultInfo last_result = 8;
  repeated VoteOptionInfo options = 9;
  // With DRAW_TARGET_OPTIONS the participants are observers and are never drawn.
  DrawTarget draw_target     = 10;
}

message ParticipantInfo {
  string email        = 1;
  string display_name = 2;
  int32  win_count    = 3;
}

message DrawResultInfo {
  string winner_email         = 1;
  string winner_display_name  = 2;
  int32  round                = 3;
  string drawn_at             = 4;  // ISO-8601
  string winner_option_title  = 5;
}

// ── Draw ──────────────────────────────────────────────────────────────────────

message DrawVoteRequest {
  string vote_id    = 1;
  int64  telegram_id = 2;
}

message DrawVoteResponse {
  bool   success              = 1;
  string winner_email         = 2;
  string winner_display_name  = 3;
  int32  round                = 4;
  bool   new_round_started    = 5;
  string message              = 6;
  string winner_option_title  = 7;
  // Set when success is false.
  ErrorCode error_code = 8;
}

message GetLastDrawResultRequest {
  string vote_id = 1;
  int64 telegram_id = 2;
}

message GetLastDrawResultResponse {
  bool           has_result = 1;
  DrawResultInfo result     = 2;
}

message GetVoteHistoryRequest {
  string vote_id = 1;
  int64 telegram_id = 2;
  int32 page = 3; // zero-based
  int32 page_size = 4; // default 20, maximum 100
}

message GetVoteHistoryResponse {
  repeated DrawResultInfo results = 1;
  int32 total_pages = 2;
  int64 total_elements = 3;
}

// ── Enums ─────────────────────────────────────────────────────────────────────

enum VoteStatus {
  VOTE_STATUS_UNSPECIFIED = 0;
  VOTE_STATUS_PENDING     = 1;
  VOTE_STATUS_DRAWN       = 2;
  VOTE_STATUS_CLOSED      = 3;
}

enum VoteMode {
  VOTE_MODE_UNSPECIFIED    = 0;
  VOTE_MODE_SIMPLE         = 1;
  VOTE_MODE_FAIR_ROTATION  = 2;
}

// What a draw picks the winner from.
enum DrawTarget {
  DRAW_TARGET_UNSPECIFIED  = 0;
  DRAW_TARGET_PARTICIPANTS = 1;
  DRAW_TARGET_OPTIONS      = 2;
}

// Machine-readable reason of an error: ErrorInfo.reason (without the prefix) and the error_code of
// mutating responses. Mirrors the backend's com.juncevich.fate.shared.ErrorCode; never renumber.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_VALIDATION_FAILED = 1;
  ERROR_CODE_REQUEST_INVALID = 2;
  ERROR_CODE_PAYLOAD_TOO_LARGE = 3;
  ERROR_CODE_UNAUTHORIZED = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_CONCURRENT_MODIFICATION = 6;
  ERROR_CODE_ALREADY_EXISTS = 7;
  ERROR_CODE_INTERNAL_ERROR = 8;
  ERROR_CODE_INVALID_EMAIL = 9;
  ERROR_CODE_INVALID_CREDENTIALS = 10;
  ERROR_CODE_EMAIL_ALREADY_REGISTERED = 11;
  ERROR_CODE_EMAIL_NOT_VERIFIED = 12;
  ERROR_CODE_WRONG_PASSWORD = 13;
  ERROR_CODE_LOGIN_THROTTLED = 14;
  ERROR_CODE_INVALID_TOKEN = 15;
  ERROR_CODE_TOKEN_EXPIRED = 16;
  ERROR_CODE_REFRESH_TOKEN_REQUIRED = 17;
  ERROR_CODE_USER_NOT_FOUND = 18;
  ERROR_CODE_EMAIL_LIMIT_REACHED = 19;
  ERROR_CODE_AVATAR_INVALID = 20;
  ERROR_CODE_AVATAR_NOT_FOUND = 21;
  ERROR_CODE_STORAGE_UNAVAILABLE = 22;
  ERROR_CODE_TELEGRAM_NOT_LINKED = 23;
  ERROR_CODE_TELEGRAM_ALREADY_LINKED = 24;
  ERROR_CODE_TELEGRAM_PRIVATE_CHAT_ONLY = 25;
  ERROR_CODE_TELEGRAM_LINK_TOKEN_INVALID = 26;
  ERROR_CODE_TELEGRAM_LINK_TOKEN_EXPIRED = 27;
  ERROR_CODE_VOTE_NOT_FOUND = 28;
  ERROR_CODE_VOTE_ACCESS_DENIED = 29;
  ERROR_CODE_NOT_VOTE_CREATOR = 30;
  ERROR_CODE_VOTE_NOT_PENDING = 31;
  ERROR_CODE_VOTE_NOT_DRAWN = 32;
  ERROR_CODE_VOTE_ALREADY_CLOSED = 33;
  ERROR_CODE_TITLE_INVALID = 34;
  ERROR_CODE_DESCRIPTION_TOO_LONG = 35;
  ERROR_CODE_TOO_MANY_PARTICIPANTS = 36;
  ERROR_CODE_TOO_MANY_OPTIONS = 37;
  ERROR_CODE_PARTICIPANT_EXISTS = 38;
  ERROR_CODE_OPTIONS_NOT_ALLOWED = 39;
  ERROR_CODE_OPTION_ORDER_INVALID = 40;
  ERROR_CODE_NO_OPTIONS = 41;
  ERROR_CODE_NO_PARTICIPANTS = 42;
  ERROR_CODE_PAGE_INVALID = 43;
  ERROR_CODE_VOTE_ID_INVALID = 44;
  ERROR_CODE_REAUTHENTICATION_REQUIRED = 45;
}
